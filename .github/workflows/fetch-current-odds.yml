name: Research - capture configured historical Shuka Sho odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Require private repository before odds capture or publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "$visibility" != "private" ]; then
            echo "::error::Odds snapshots and model-derived market files must not be published from a public repository. Make the repository private first."
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch odds for the race ID configured in the research script
        shell: bash
        run: |
          mkdir -p results/live_odds
          python scripts/collect_live_all_odds.py
      - name: Keep source timestamps and exact source values
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 20261018-akikasho-all-pool-odds
          retention-days: 7
          path: |
            results/live_odds/all_pools_snapshot.json
            results/live_odds/snapshot_audit.json
          if-no-files-found: warn
      - name: Save private research snapshot in repository
        if: success()
        shell: bash
        run: |
          if [ -f results/live_odds/snapshot_audit.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/live_odds/all_pools_snapshot.json results/live_odds/snapshot_audit.json
            git commit -m "Archive timestamped Shuka Sho historical odds snapshot"
            git push
          fi
